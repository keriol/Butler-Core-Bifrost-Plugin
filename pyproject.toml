[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "butler-core-bifrost-plugin"
version = "0.0.1"
description = "Replaceable client-to-Butler bridge for the Butler ecosystem"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = []

[project.scripts]
bifrost-probe = "butler_bifrost.probe:main"

[project.optional-dependencies]
http = [
    "httpx>=0.28,<1",
]
dev = [
    "httpx>=0.28,<1",
    "build>=1.2",
    "pytest>=9,<10",
    "pytest-asyncio>=1,<2",
    "pytest-cov>=7,<8",
    "wheel>=0.45",
]

[tool.setuptools.packages.find]
where = ["src"]
